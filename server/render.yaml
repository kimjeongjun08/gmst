# Render Blueprint — 3과제 체험 API 배포
# Render: New + → Blueprint → 이 저장소 선택. (루트가 gmst/server 가 되도록
# rootDir 를 지정하거나, 이 server 폴더만 별도 저장소로 올려도 됩니다.)
services:
  - type: web
    name: gmst-task3-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    autoDeploy: true
